<?xml version="1.0" encoding="UTF-8"?>
<!--
  Grox horizontal lockup: mark + wordmark
  Width flexible; height 40 recommended for nav
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 40" role="img" aria-label="Grox">
  <title>Grox</title>
  <!-- Mark -->
  <g transform="translate(0,0)">
    <rect width="40" height="40" rx="10" fill="#0d0d0d"/>
    <circle cx="20" cy="20" r="11.5" fill="none" stroke="#f7f7f8" stroke-width="2.1"
            stroke-linecap="round" stroke-dasharray="57 15" stroke-dashoffset="5"/>
    <path fill="none" stroke="#f7f7f8" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"
          d="M25.2 17.6
             C25.2 13.8 22.5 11.6 20 11.6
             C16.1 11.6 13.2 14.6 13.2 20
             C13.2 25.4 16.1 28.4 20 28.4
             C22.6 28.4 24.7 27 25.4 24.6"/>
    <path fill="none" stroke="#f7f7f8" stroke-width="2.1" stroke-linecap="round"
          d="M19.8 20 H25.8"/>
    <circle cx="25.8" cy="20" r="1.95" fill="#0ea5e9"/>
    <circle cx="25.8" cy="20" r="0.7" fill="#0d0d0d"/>
  </g>
  <!-- Wordmark -->
  <text x="50" y="27"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="22" font-weight="600" letter-spacing="-0.03em" fill="#0d0d0d">Grox</text>
</svg>
